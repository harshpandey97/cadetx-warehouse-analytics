<svg xmlns="http://www.w3.org/2000/svg" width="720" height="130" viewBox="0 0 720 130" role="img" aria-label="Purchase orders: received vs pending">
<style>
  @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @keyframes fill { from { transform: scaleY(0); } to { transform: scaleY(1); } }
  .bar { transform-box: fill-box; transform-origin: left center; animation: grow 1.2s ease-out both; }
  .seg { transform-box: fill-box; transform-origin: center bottom; animation: fill 0.5s ease-out both; }
  .label { animation: fadeUp 0.6s ease-out both; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<rect width="720" height="130" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="20" y="30" font-size="18" font-weight="600" fill="#24292f" style="font-family: 'Segoe UI', Helvetica, Arial, sans-serif">Purchase orders: received vs pending</text>
<rect class="seg" x="20.0" y="50" width="612.9" height="36" fill="#2da44e" style="animation-delay:0.00s"/>
<text class="label" x="28.0" y="108" text-anchor="start" font-size="13" fill="#24292f" style="font-family: 'Segoe UI', Helvetica, Arial, sans-serif;animation-delay:0.40s">Received: 21,630 (90.1%)</text>
<rect class="seg" x="632.9" y="50" width="67.2" height="36" fill="#d4a72c" style="animation-delay:0.20s"/>
<text class="label" x="692.0" y="108" text-anchor="end" font-size="13" fill="#24292f" style="font-family: 'Segoe UI', Helvetica, Arial, sans-serif;animation-delay:0.60s">Pending: 2,370 (9.9%)</text>
</svg>
