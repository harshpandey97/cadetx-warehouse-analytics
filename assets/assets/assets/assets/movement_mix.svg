<svg xmlns="http://www.w3.org/2000/svg" width="720" height="208" viewBox="0 0 720 208" role="img" aria-label="Stock movement mix">
<style>
  @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @keyframes fill { from { transform: scaleY(0); } to { transform: scaleY(1); } }
  .bar { transform-box: fill-box; transform-origin: left center; animation: grow 1.2s ease-out both; }
  .seg { transform-box: fill-box; transform-origin: center bottom; animation: fill 0.5s ease-out both; }
  .label { animation: fadeUp 0.6s ease-out both; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<rect width="720" height="208" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="20" y="32" font-size="18" font-weight="600" fill="#24292f" style="font-family: 'Segoe UI', Helvetica, Arial, sans-serif">Stock movement mix</text>
<text class="label" x="20" y="78" font-size="14" fill="#24292f" style="font-family: 'Segoe UI', Helvetica, Arial, sans-serif;animation-delay:0.00s">IN</text>
<rect x="230" y="64" width="380" height="20" rx="10" fill="#eaeef2"/>
<rect class="bar" x="230" y="64" width="380.0" height="20" rx="10" fill="#8250df" style="animation-delay:0.00s"/>
<text class="label" x="620" y="79" font-size="13" fill="#57606a" style="font-family: 'Segoe UI', Helvetica, Arial, sans-serif;animation-delay:0.30s">127,611</text>
<text class="label" x="20" y="122" font-size="14" fill="#24292f" style="font-family: 'Segoe UI', Helvetica, Arial, sans-serif;animation-delay:0.15s">OUT</text>
<rect x="230" y="108" width="380" height="20" rx="10" fill="#eaeef2"/>
<rect class="bar" x="230" y="108" width="319.1" height="20" rx="10" fill="#bf3989" style="animation-delay:0.15s"/>
<text class="label" x="620" y="123" font-size="13" fill="#57606a" style="font-family: 'Segoe UI', Helvetica, Arial, sans-serif;animation-delay:0.45s">107,165</text>
<text class="label" x="20" y="166" font-size="14" fill="#24292f" style="font-family: 'Segoe UI', Helvetica, Arial, sans-serif;animation-delay:0.30s">ADJUSTMENT</text>
<rect x="230" y="152" width="380" height="20" rx="10" fill="#eaeef2"/>
<rect class="bar" x="230" y="152" width="7.3" height="20" rx="10" fill="#6e7781" style="animation-delay:0.30s"/>
<text class="label" x="620" y="167" font-size="13" fill="#57606a" style="font-family: 'Segoe UI', Helvetica, Arial, sans-serif;animation-delay:0.60s">2,454</text>
</svg>
