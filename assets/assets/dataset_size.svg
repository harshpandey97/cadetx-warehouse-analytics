<svg xmlns="http://www.w3.org/2000/svg" width="720" height="428" viewBox="0 0 720 428" role="img" aria-label="Dataset size (Week 1 summary)">
<style>
  @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @keyframes fill { from { transform: scaleY(0); } to { transform: scaleY(1); } }
  .bar { transform-box: fill-box; transform-origin: left center; animation: grow 1.2s ease-out both; }
  .seg { transform-box: fill-box; transform-origin: center bottom; animation: fill 0.5s ease-out both; }
  .label { animation: fadeUp 0.6s ease-out both; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
